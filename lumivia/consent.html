<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>乐米画布账号同步</title>
<script nonce="SCRIPT_NONCE">
const canvas = 'https://canvas.lumivia.cn';
const send = (data) => window.parent.postMessage(data, canvas);
const token = () => localStorage.getItem('auth_token');

window.addEventListener('storage', (event) => {
    if (event.key === 'auth_token' || event.key === null) send({ type: 'lumivia:account-changed' });
});
window.addEventListener('message', async (event) => {
    const request = event.data;
    if (window.parent === window || event.source !== window.parent || event.origin !== canvas || request?.type !== 'lumivia:authorize') return;
    const reply = (data) => send({ type: 'lumivia:authorization', id: request.id, ...data });
    try {
        const current = token();
        if (!current) return reply({ status: 401 });
        const response = await fetch('/canvas-connect/approve', {
            method: 'POST', cache: 'no-store',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${current}` },
            body: JSON.stringify({ action: request.action, challenge: request.challenge, account_id: request.accountId, channel_id: request.channelId, model: request.model }),
        });
        const body = await response.json();
        // A request begun before switching accounts cannot return a usable grant.
        if (current !== token()) return reply({ status: 409 });
        reply({ status: response.status, account: body.account, grant: body.grant, error: body.error?.message });
    } catch {
        reply({ status: 503 });
    }
});
if (window.parent !== window) send({ type: 'lumivia:ready' });
</script>
</html>
