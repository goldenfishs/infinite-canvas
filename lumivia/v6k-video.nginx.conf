pid /tmp/nginx.pid;
error_log stderr warn;
worker_processes 1;

events {
    worker_connections 128;
}

http {
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        resolver 127.0.0.11 valid=60s ipv6=off;
        set $v6k_origin www.v6k.top;
        client_max_body_size 90m;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 45s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_next_upstream off;
        proxy_redirect off;
        proxy_ssl_server_name on;
        proxy_ssl_name $v6k_origin;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 4;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_pass_request_headers off;
        proxy_set_header Host $v6k_origin;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Accept application/json;
        proxy_set_header Connection "";
        add_header Cache-Control "private, no-store" always;

        location = /healthz {
            return 200 "ok\n";
        }
        location = /v1/videos {
            if ($request_method != POST) { return 405; }
            proxy_pass https://$v6k_origin$uri;
        }
        location ~ "^/v1/videos/task_[A-Za-z0-9_-]{1,160}$" {
            if ($request_method != GET) { return 405; }
            proxy_pass https://$v6k_origin$uri;
        }
        location ~ "^/v1/videos/task_[A-Za-z0-9_-]{1,160}/content$" {
            if ($request_method != GET) { return 405; }
            # BPS 2.21.6 finalizes billing when the content endpoint returns 302.
            proxy_intercept_errors on;
            error_page 303 = @content_redirect;
            proxy_pass https://$v6k_origin$uri;
        }
        location @content_redirect {
            if ($upstream_http_location !~ "^https://") { return 502; }
            return 302 $upstream_http_location;
        }
        location / {
            return 404;
        }
    }
}
